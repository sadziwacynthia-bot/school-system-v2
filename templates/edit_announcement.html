{% extends "base_premium.html" %}

{% block title %}Edit Announcement | EduTrack{% endblock %}

{% block content %}

<style>
    .form-page {
        padding: 25px;
        background: #f4f6f9;
        min-height: 100vh;
    }

    .form-card {
        max-width: 900px;
        margin: auto;
        background: white;
        border-radius: 18px;
        padding: 26px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    .form-card h1 {
        margin-top: 0;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 700;
    }

    .form-control {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font: inherit;
    }

    textarea.form-control {
        min-height: 160px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
    }

    .button {
        border: none;
        border-radius: 10px;
        padding: 11px 17px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
    }

    .save-button {
        background: #2563eb;
        color: white;
    }

    .cancel-button {
        background: #e5e7eb;
        color: #374151;
    }

    @media (max-width: 700px) {
        .form-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="form-page">

    <div class="form-card">

        <h1>Edit Announcement</h1>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group full">
                    <label>Announcement Title</label>

                    <input
                        type="text"
                        name="title"
                        value="{{ announcement.title }}"
                        class="form-control"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select name="category" class="form-control">
                        {% for value in [
                            'General',
                            'Academic',
                            'Finance',
                            'Sports',
                            'Examination',
                            'Event',
                            'Emergency'
                        ] %}
                        <option
                            value="{{ value }}"
                            {% if
                                (announcement.category or 'General')
                                == value
                            %}
                            selected
                            {% endif %}
                        >
                            {{ value }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Priority</label>

                    <select name="priority" class="form-control">
                        {% for value in [
                            'Normal',
                            'Important',
                            'Urgent'
                        ] %}
                        <option
                            value="{{ value }}"
                            {% if
                                (announcement.priority or 'Normal')
                                == value
                            %}
                            selected
                            {% endif %}
                        >
                            {{ value }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Audience</label>

                    <select
                        id="audience"
                        name="audience"
                        class="form-control"
                        onchange="toggleClassField()"
                    >
                        {% for value in [
                            'Everyone',
                            'Parents',
                            'Teachers',
                            'Students',
                            'Specific Class'
                        ] %}
                        <option
                            value="{{ value }}"
                            {% if
                                (announcement.audience or 'Everyone')
                                == value
                            %}
                            selected
                            {% endif %}
                        >
                            {{ value }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group" id="class-field">
                    <label>Class</label>

                    <select
                        id="class_name"
                        name="class_name"
                        class="form-control"
                    >
                        <option value="">Select class</option>

                        {% for school_class in classes %}
                        <option
                            value="{{ school_class.class_name }}"
                            {% if
                                announcement.class_name
                                == school_class.class_name
                            %}
                            selected
                            {% endif %}
                        >
                            {{ school_class.class_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Publish Date</label>

                    <input
                        type="date"
                        name="publish_date"
                        value="{{ announcement.publish_date or announcement.date or '' }}"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label>Expiry Date</label>

                    <input
                        type="date"
                        name="expiry_date"
                        value="{{ announcement.expiry_date or '' }}"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select name="status" class="form-control">
                        <option
                            value="Published"
                            {% if
                                (announcement.status or 'Published')
                                == 'Published'
                            %}
                            selected
                            {% endif %}
                        >
                            Published
                        </option>

                        <option
                            value="Draft"
                            {% if announcement.status == 'Draft' %}
                            selected
                            {% endif %}
                        >
                            Draft
                        </option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Message</label>

                    <textarea
                        name="message"
                        class="form-control"
                        required
                    >{{ announcement.message }}</textarea>
                </div>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="button save-button"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('communications') }}"
                    class="button cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<script>
    function toggleClassField() {
        const audience = document.getElementById("audience").value;
        const classField = document.getElementById("class-field");

        if (audience === "Specific Class") {
            classField.style.display = "block";
        } else {
            classField.style.display = "none";
        }
    }

    toggleClassField();
</script>

{% endblock %}
