{% extends "base_premium.html" %}

{% block title %}Add Calendar Event | EduTrack{% endblock %}

{% block content %}

<style>
    .event-form-page {
        padding: 25px;
        min-height: 100vh;
        background: #f4f6f9;
    }

    .event-form-card {
        max-width: 900px;
        margin: auto;
        padding: 26px;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        background: white;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
    }

    .event-form-card h1 {
        margin-top: 0;
        color: #111827;
    }

    .event-form-card > p {
        color: #6b7280;
    }

    .event-form-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 700;
        color: #374151;
    }

    .form-control {
        width: 100%;
        box-sizing: border-box;
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font: inherit;
    }

    textarea.form-control {
        min-height: 140px;
        resize: vertical;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .button {
        padding: 11px 17px;
        border: none;
        border-radius: 10px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
    }

    .save-button {
        background: #2563eb;
        color: white;
    }

    .cancel-button {
        background: #e5e7eb;
        color: #374151;
    }

    @media (max-width: 700px) {
        .event-form-grid {
            grid-template-columns: 1fr;
        }

        .event-form-page {
            padding: 15px;
        }
    }
</style>

<div class="event-form-page">

    <div class="event-form-card">

        <h1>Add Calendar Event</h1>

        <p>
            Add an important school date, activity, meeting or event.
        </p>

        <form method="POST">

            <div class="event-form-grid">

                <div class="form-group full">
                    <label for="title">Event Title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="event_type">Event Type</label>

                    <select
                        id="event_type"
                        name="event_type"
                        class="form-control"
                    >
                        <option>General</option>
                        <option>Academic</option>
                        <option>Examination</option>
                        <option>Sports</option>
                        <option>Holiday</option>
                        <option>Meeting</option>
                        <option>Trip</option>
                        <option>Deadline</option>
                        <option>Celebration</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="audience">Audience</label>

                    <select
                        id="audience"
                        name="audience"
                        class="form-control"
                        onchange="toggleClassField()"
                    >
                        <option>Everyone</option>
                        <option>Parents</option>
                        <option>Teachers</option>
                        <option>Students</option>
                        <option>Specific Class</option>
                    </select>
                </div>

                <div
                    class="form-group full"
                    id="class-field"
                    style="display:none;"
                >
                    <label for="class_name">Class</label>

                    <select
                        id="class_name"
                        name="class_name"
                        class="form-control"
                    >
                        <option value="">Select class</option>

                        {% for school_class in classes %}
                        <option value="{{ school_class.class_name }}">
                            {{ school_class.class_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="start_date">Start Date</label>

                    <input
                        type="date"
                        id="start_date"
                        name="start_date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="end_date">End Date</label>

                    <input
                        type="date"
                        id="end_date"
                        name="end_date"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label for="start_time">Start Time</label>

                    <input
                        type="time"
                        id="start_time"
                        name="start_time"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label for="end_time">End Time</label>

                    <input
                        type="time"
                        id="end_time"
                        name="end_time"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location</label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        class="form-control"
                        placeholder="e.g. School Hall"
                    >
                </div>

                <div class="form-group">
                    <label for="status">Status</label>

                    <select
                        id="status"
                        name="status"
                        class="form-control"
                    >
                        <option>Published</option>
                        <option>Draft</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        placeholder="Enter event details..."
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="button save-button"
                >
                    Save Event
                </button>

                <a
                    href="{{ url_for('school_calendar') }}"
                    class="button cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<script>
    function toggleClassField() {
        const audience =
            document.getElementById("audience").value;

        const classField =
            document.getElementById("class-field");

        const classSelect =
            document.getElementById("class_name");

        if (audience === "Specific Class") {
            classField.style.display = "block";
        } else {
            classField.style.display = "none";
            classSelect.value = "";
        }
    }

    toggleClassField();
</script>

{% endblock %}
