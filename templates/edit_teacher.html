{% extends "base.html" %}
{% block content %}

<div class="form-page">

  <div class="page-header">
    <div>
      <p class="eyebrow">Teachers</p>
      <h1>Edit Teacher</h1>
      <p class="muted">Update teacher information and status.</p>
    </div>
  </div>

  <div class="form-card">
    <form method="POST" action="{{ url_for('update_teacher', teacher_id=teacher.id) }}">

      <div class="form-grid">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" value="{{ teacher.full_name }}" required>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ teacher.email or '' }}">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" value="{{ teacher.phone or '' }}">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="Male" {% if teacher.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if teacher.gender == "Female" %}selected{% endif %}>Female</option>
          </select>
        </div>

        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option value="Active" {% if teacher.status == "Active" %}selected{% endif %}>Active</option>
            <option value="Inactive" {% if teacher.status == "Inactive" %}selected{% endif %}>Inactive</option>
          </select>
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="btn primary">
          Update Teacher
        </button>
      </div>

    </form>
  </div>

</div>

<style>
.form-page {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.page-header {
  margin-bottom: 16px;
}

.eyebrow {
  font-size: 11px;
  color: #2563eb;
  font-weight: 800;
  text-transform: uppercase;
}

.page-header h1 {
  margin: 4px 0;
  color: #0f172a;
}

.muted {
  color: #64748b;
  font-size: 13px;
}

.form-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #334155;
}

.form-group input,
.form-group select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
}

.submit-row {
  margin-top: 18px;
}

.btn {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  cursor: pointer;
}

.btn.primary {
  background: #2563eb;
  color: white;
}

@media (max-width: 700px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>

{% endblock %}
