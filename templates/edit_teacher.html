{% extends "base_premium.html" %}
{% block content %}

<div class="form-page">

  <div class="page-header">
    <div>
      <p class="eyebrow">Teachers</p>
      <h1>Edit Teacher</h1>
      <p class="muted">Update teacher contact information.</p>
    </div>

    <a href="{{ url_for('teachers') }}" class="btn">Back to Teachers</a>
  </div>

  <div class="form-card">
    <form method="POST" action="{{ url_for('update_teacher', teacher_id=teacher.id) }}">

      <div class="form-grid">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="full_name" value="{{ teacher.full_name or '' }}" required>
        </div>

        <div class="form-group">
          <label>Teacher ID</label>
          <input type="text" value="{{ teacher.teacher_id or '' }}" disabled>
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" value="{{ teacher.email or '' }}">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" value="{{ teacher.phone or '' }}">
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="btn primary">Update Teacher</button>
      </div>

    </form>
  </div>

</div>

<style>
.form-page {
  max-width: 850px;
  margin: auto;
  padding: 16px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.eyebrow {
  font-size: 11px;
  color: #2563eb;
  font-weight: 800;
  text-transform: uppercase;
  margin: 0;
}

.page-header h1 {
  margin: 4px 0;
  font-size: 24px;
  color: #0f172a;
}

.muted {
  color: #64748b;
  font-size: 13px;
  margin: 0;
}

.form-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #334155;
}

.form-group input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
}

.form-group input:disabled {
  background: #f8fafc;
  color: #64748b;
}

.submit-row {
  margin-top: 18px;
}

.btn {
  text-decoration: none;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid #dbe3ef;
  background: white;
  color: #0f172a;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

.btn.primary {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

@media (max-width: 700px) {
  .page-header {
    display: block;
  }

  .page-header .btn {
    display: inline-block;
    margin-top: 12px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>

{% endblock %}
