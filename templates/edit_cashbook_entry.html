{% extends "base_premium.html" %}
{% block content %}

<div class="form-page">

  <div class="page-header">
    <div>
      <p class="eyebrow">Finance</p>
      <h1>Edit Cashbook Entry</h1>
      <p class="muted">Update transaction information.</p>
    </div>

    <a href="{{ url_for('cashbook') }}" class="btn">
      Back
    </a>
  </div>

  <div class="form-card">

    <form method="POST"
          action="{{ url_for('update_cashbook_entry', entry_id=entry.id) }}">

      <div class="form-grid">

        <div class="form-group">
          <label>Description</label>
          <input type="text"
                 name="description"
                 value="{{ entry.description or '' }}"
                 required>
        </div>

        <div class="form-group">
          <label>Category</label>
          <input type="text"
                 name="category"
                 value="{{ entry.category or '' }}">
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <input type="text"
                 name="payment_method"
                 value="{{ entry.payment_method or '' }}">
        </div>

        <div class="form-group">
          <label>Reference Number</label>
          <input type="text"
                 name="reference_number"
                 value="{{ entry.reference_number or '' }}">
        </div>

        <div class="form-group">
          <label>Amount</label>
          <input type="number"
                 step="0.01"
                 name="amount"
                 value="{{ entry.amount or 0 }}"
                 required>
        </div>

        <div class="form-group">
          <label>Type</label>
          <input type="text"
                 value="{{ entry.entry_type or '' }}"
                 disabled>
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="btn primary">
          Update Entry
        </button>
      </div>

    </form>

  </div>

</div>

<style>
.form-page {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.eyebrow {
  font-size: 11px;
  color: #2563eb;
  font-weight: 800;
  text-transform: uppercase;
}

.page-header h1 {
  margin: 4px 0;
  color: #0f172a;
}

.muted {
  color: #64748b;
  font-size: 13px;
}

.form-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 18px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #334155;
}

.form-group input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
}

.form-group input:disabled {
  background: #f8fafc;
}

.submit-row {
  margin-top: 18px;
}

.btn {
  text-decoration: none;
  padding: 9px 14px;
  border-radius: 10px;
  border: 1px solid #dbe3ef;
  background: white;
  color: #0f172a;
  font-weight: 700;
  cursor: pointer;
}

.btn.primary {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

@media (max-width: 700px) {

  .page-header {
    flex-direction: column;
    align-items: stretch;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
}
</style>

{% endblock %}
