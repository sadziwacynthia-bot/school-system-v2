{% extends "base_premium.html" %}

{% block content %}

<div class="page-header-card">
  <h1>Add Cashbook Entry</h1>
  <p>Record income or expenses with full transaction details.</p>
</div>

<div class="premium-card">

  <div style="margin-bottom:20px;">
    <a
      href="{{ url_for('cashbook') }}"
      class="premium-btn premium-btn-light"
    >
      ← Back to Cashbook
    </a>
  </div>

  <form
    method="POST"
    action="{{ url_for('add_cashbook_entry') }}"
  >

    <div class="form-grid">

      {% if session.get("role") == "super_admin" %}

      <div class="form-group">
        <label for="school_id">School</label>

        <select
          id="school_id"
          name="school_id"
          required
        >
          <option value="">
            Select School
          </option>

          {% for school in schools %}
          <option value="{{ school.id }}">
            {{ school.school_name }}
          </option>
          {% endfor %}
        </select>
      </div>

      {% endif %}

      <div class="form-group">
        <label for="entry_date">
          Entry Date
        </label>

        <input
          type="date"
          id="entry_date"
          name="entry_date"
          required
        >
      </div>

      <div class="form-group">
        <label for="entry_type">
          Entry Type
        </label>

        <select
          id="entry_type"
          name="entry_type"
          required
        >
          <option value="">
            Select Type
          </option>

          <option value="income">
            Income
          </option>

          <option value="expense">
            Expense
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="category">
          Category
        </label>

        <select
          id="category"
          name="category"
          required
        >
          <option value="">
            Select Category
          </option>

          <optgroup label="Income">
            <option value="School Fees">School Fees</option>
            <option value="Donations">Donations</option>
            <option value="Uniform Sales">Uniform Sales</option>
            <option value="Transport Fees">Transport Fees</option>
            <option value="Other Income">Other Income</option>
          </optgroup>

          <optgroup label="Expenses">
            <option value="Salaries">Salaries</option>
            <option value="Transport">Transport</option>
            <option value="Electricity">Electricity</option>
            <option value="Water">Water</option>
            <option value="Repairs">Repairs</option>
            <option value="Stationery">Stationery</option>
            <option value="Other Expense">Other Expense</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">
          Amount
        </label>

        <input
          type="number"
          id="amount"
          step="0.01"
          name="amount"
          placeholder="0.00"
          required
        >
      </div>

      <div class="form-group full-width">
        <label for="description">
          Description
        </label>

        <textarea
          id="description"
          name="description"
          rows="4"
          placeholder="Enter transaction details..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="payment_method">
          Payment Method
        </label>

        <select
          id="payment_method"
          name="payment_method"
        >
          <option value="">
            Select Method
          </option>

          <option value="Cash">
            Cash
          </option>

          <option value="Bank Transfer">
            Bank Transfer
          </option>

          <option value="Ecocash">
            Ecocash
          </option>

          <option value="Swipe">
            Swipe
          </option>

          <option value="Cheque">
            Cheque
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="reference_number">
          Reference Number
        </label>

        <input
          type="text"
          id="reference_number"
          name="reference_number"
          placeholder="Optional external reference"
        >
      </div>

    </div>

    <div class="submit-row">
      <button
        type="submit"
        class="premium-btn"
      >
        Save Entry
      </button>
    </div>

  </form>

</div>

{% endblock %}
