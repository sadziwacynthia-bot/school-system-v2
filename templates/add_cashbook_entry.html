{% extends "base_premium.html" %}
{% block content %}

<div class="form-page">

  <div class="page-header">
    <div>
      <p class="eyebrow">Finance</p>
      <h1>Add Cashbook Entry</h1>
      <p class="muted">Record income or expenses for the school.</p>
    </div>

    <a href="{{ url_for('cashbook') }}" class="btn">
      Back to Cashbook
    </a>
  </div>

  <div class="form-card">

    <form method="POST" action="{{ url_for('add_cashbook_entry') }}">

      <div class="form-grid">

        <div class="form-group">
          <label>Entry Date</label>
          <input type="date" name="entry_date" required>
        </div>

        <div class="form-group">
          <label>Entry Type</label>
          <select name="entry_type" required>
            <option value="">Select Type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            <option value="">Select Category</option>

            <optgroup label="Income">
              <option value="School Fees">School Fees</option>
              <option value="Donations">Donations</option>
              <option value="Uniform Sales">Uniform Sales</option>
              <option value="Transport Fees">Transport Fees</option>
              <option value="Other Income">Other Income</option>
            </optgroup>

            <optgroup label="Expenses">
              <option value="Salaries">Salaries</option>
              <option value="Transport">Transport</option>
              <option value="Electricity">Electricity</option>
              <option value="Water">Water</option>
              <option value="Repairs">Repairs</option>
              <option value="Stationery">Stationery</option>
              <option value="Other Expense">Other Expense</option>
            </optgroup>

          </select>
        </div>

        <div class="form-group">
          <label>Amount</label>
          <input type="number"
                 step="0.01"
                 name="amount"
                 placeholder="0.00"
                 required>
        </div>

        <div class="form-group full-width">
          <label>Description</label>
          <textarea name="description"
                    rows="4"
                    placeholder="Enter transaction details..."
                    required></textarea>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <select name="payment_method">
            <option value="">Select Method</option>
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Ecocash">Ecocash</option>
            <option value="Swipe">Swipe</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>

        <div class="form-group">
          <label>Reference Number</label>
          <input type="text"
                 name="reference_number"
                 placeholder="Optional reference">
        </div>

      </div>

      <div class="submit-row">
        <button type="submit" class="btn primary">
          Save Entry
        </button>
      </div>

    </form>

  </div>

</div>

<style>
.form-page {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 12px;
}

.eyebrow {
  font-size: 11px;
  color: #2563eb;
  font-weight: 800;
  text-transform: uppercase;
  margin: 0;
}

.page-header h1 {
  margin: 4px 0;
  font-size: 26px;
  color: #0f172a;
}

.muted {
  color: #64748b;
  font-size: 13px;
  margin: 0;
}

.form-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.full-width {
  grid-column: 1 / -1;
}

.form-group label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #334155;
}

.form-group input,
.form-group select,
.form-group textarea {
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  font-size: 14px;
  resize: vertical;
}

.form-group textarea {
  min-height: 100px;
}

.submit-row {
  margin-top: 20px;
}

.btn {
  text-decoration: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  border: 1px solid #dbe3ef;
  background: white;
  color: #0f172a;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.btn.primary {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

@media (max-width: 700px) {

  .page-header {
    flex-direction: column;
    align-items: stretch;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full-width {
    grid-column: auto;
  }
}
</style>

{% endblock %}
